name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate

      # Disponibiliza a extensão como .zip na aba "Actions" do GitHub (expira em 30 dias).
      - uses: actions/upload-artifact@v4
        with:
          name: antiJequi-${{ github.sha }}
          path: dist/antiJequi
          retention-days: 30
